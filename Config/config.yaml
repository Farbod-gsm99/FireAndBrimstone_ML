behaviors:
  CubeAgent:
    trainer_type: ppo
    hyperparameters:
      # Tuned for 16 parallel arenas on RTX 4060 Ti (16GB VRAM) with Discrete Actions
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        # Intrinsic curiosity helps the agent discover pushing the Magma Core in Rooms 3 & 4
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
          num_layers: 2
        learning_rate: 0.0003
    keep_checkpoints: 10
    checkpoint_interval: 250000
    max_steps: 6000000
    time_horizon: 128
    summary_freq: 10000
    threaded: false

environment_parameters:
  room_lesson:
    curriculum:
      - name: Lesson0_MagmaGrid
        completion_criteria:
          measure: reward
          behavior: CubeAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.75
        value: 0.0
      - name: Lesson1_CrossfireCourtyard
        completion_criteria:
          measure: reward
          behavior: CubeAgent
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.85
        value: 1.0
      - name: Lesson2_GeyserPlug
        completion_criteria:
          measure: reward
          behavior: CubeAgent
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 1.15
        value: 2.0
      - name: Lesson3_BossFight
        value: 3.0

engine_settings:
  width: 1280
  height: 720
  quality_level: 1
  time_scale: 20.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
